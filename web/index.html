<h1>Move-out Proof: answer the letter with the photos you already took</h1>
<p>Move-out Proof is a Skill for the UGREEN AI NAS assistant. A renter says their move-in and move-out dates; the Skill finds their dated move-in and move-out photos on the NAS, has the vision model name the spot in each photo, reads the charges on the landlord's deduction letter, and lines up the two photos of the same spot beside each charge, with their capture dates. Gaps are stated ("No dated move-in photo of this spot") and nothing is written until the renter approves. The model looks. The camera dates decide. You approve.</p>
<p>This page replays recorded runs of an emulator that executes the real SKILL.md with expert agents named after UGREEN's public capability catalog, over a staged demo apartment (stock photos with assigned dates). It makes no model calls. Turn on JavaScript to play the replay.</p>
